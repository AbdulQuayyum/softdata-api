openapi: 3.1.0
info:
  title: SoftData API
  version: 1.0.0
  description: Public datasets API with optional developer accounts and API keys.
servers:
  - url: https://softdata-api.vercel.app
    description: Production
tags:
  - name: Health
  - name: Discovery
  - name: Datasets
  - name: Geography
  - name: Education
  - name: Finance
  - name: Authentication
  - name: Account
  - name: API Keys
  - name: Usage
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1:
    get:
      tags: [Discovery]
      summary: API discovery
      responses:
        "200":
          description: API information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiInfoResponse"
  /v1/datasets:
    get:
      tags: [Datasets]
      summary: List datasets
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Dataset list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetListResponse"
  /v1/datasets/{dataset_id}:
    get:
      tags: [Datasets]
      summary: Get dataset details
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Dataset details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/datasets/{dataset_id}/versions:
    get:
      tags: [Datasets]
      summary: List dataset versions
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Dataset versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetVersionsResponse"
  /v1/datasets/{dataset_id}/sources:
    get:
      tags: [Datasets]
      summary: List dataset sources
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Dataset sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetSourcesResponse"
  /v1/datasets/{dataset_id}/download:
    get:
      tags: [Datasets]
      summary: Download a dataset
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Dataset download
          content:
            application/json:
              schema:
                type: object
  /v1/geography/states:
    get:
      tags: [Geography]
      summary: List states
      responses:
        "200":
          description: State records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateListResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/states/{state_id}:
    get:
      tags: [Geography]
      summary: Get a state
      parameters:
        - $ref: "#/components/parameters/StateID"
      responses:
        "200":
          description: State record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/geopolitical-zones:
    get:
      tags: [Geography]
      summary: List geopolitical zones
      responses:
        "200":
          description: Geopolitical zone records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeopoliticalZoneListResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/geopolitical-zones/{zone_id}:
    get:
      tags: [Geography]
      summary: Get a geopolitical zone
      parameters:
        - $ref: "#/components/parameters/ZoneID"
      responses:
        "200":
          description: Geopolitical zone record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeopoliticalZoneResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/lgas:
    get:
      tags: [Geography]
      summary: List local government units and FCT Area Councils
      parameters:
        - $ref: "#/components/parameters/StateIDQuery"
      responses:
        "200":
          description: Local-government-unit records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalGovernmentUnitListResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/lgas/{lga_id}:
    get:
      tags: [Geography]
      summary: Get a local government unit or FCT Area Council
      parameters:
        - $ref: "#/components/parameters/LGAID"
      responses:
        "200":
          description: Local-government-unit record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalGovernmentUnitResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/languages:
    get:
      tags: [Geography]
      summary: List CLDR-derived world languages
      description: Returns the 633 current English CLDR base-language records. This v1 endpoint has no pagination or search and is publicly accessible.
      responses:
        "200":
          description: Language records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageListResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/languages/{language_id}:
    get:
      tags: [Geography]
      summary: Get a CLDR-derived world language
      parameters:
        - $ref: "#/components/parameters/LanguageID"
      responses:
        "200":
          description: Language record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/country-languages:
    get:
      tags: [Geography]
      summary: List CLDR-derived country-language relationships
      description: Returns all 1,289 relationships when filters are omitted. Filters use AND semantics, are optional, and no pagination is available in v1. The used status means CLDR supplied a relationship without officialStatus and does not independently claim legal recognition or official status.
      parameters:
        - $ref: "#/components/parameters/CountryLanguageCountryAreaID"
        - $ref: "#/components/parameters/CountryLanguageIDQuery"
        - $ref: "#/components/parameters/CountryLanguageStatusQuery"
      responses:
        "200":
          description: Country-language relationship records; an empty array is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryLanguageListResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/time-zones:
    get:
      tags: [Geography]
      summary: List time zones
      description: Returns the current canonical IANA time-zone manifest from tzdb 2026c, limited to zone1970.tab entries. Aliases are excluded from v1. Asia/Taipei has an empty country_area_ids array because TW has no approved SoftData M49 ID, while bv and hm are valid filters that return empty lists. The list is public and returns deterministic ordering with no pagination.
      parameters:
        - $ref: "#/components/parameters/TimeZoneCountryAreaID"
      responses:
        "200":
          description: Time-zone records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeZoneListResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/time-zones/{time_zone_id}:
    get:
      tags: [Geography]
      summary: Get a time zone
      description: Returns a canonical IANA time-zone identifier using an exact decoded path value. The detail route accepts percent-encoded slashes at the HTTP layer, but the public identifier remains the canonical IANA name. Aliases are excluded from v1.
      parameters:
        - $ref: "#/components/parameters/TimeZoneID"
      responses:
        "200":
          description: Time-zone record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeZoneResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/countries:
    get:
      tags: [Geography]
      summary: List countries and areas
      description: Returns the current UN M49 countries or areas snapshot. Region and subregion filters are optional and may be combined. Statistical designations are used for reference only and do not imply political recognition or legal status.
      parameters:
        - $ref: "#/components/parameters/CountryOrAreaRegionCode"
        - $ref: "#/components/parameters/CountryOrAreaSubregionCode"
      responses:
        "200":
          description: Country-or-area records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryOrAreaListResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/countries/{country_id}:
    get:
      tags: [Geography]
      summary: Get a country or area
      description: Returns a verified country-or-area record from the current UN M49 snapshot. Statistical designations are used for reference only and do not imply political recognition or legal status.
      parameters:
        - $ref: "#/components/parameters/CountryOrAreaID"
      responses:
        "200":
          description: Country-or-area record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryOrAreaResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/countries/{country_id}/profile:
    get:
      tags: [Geography]
      summary: Get a country profile
      description: Returns a derived profile for a current UN M49 country or area, combining the country-or-area record with approved currency, time-zone, and CLDR-derived country-language relationships. The language_ids array references world-languages.id and includes every relationship status; presence does not mean every listed language is nationally official. Use /v1/geography/country-languages for status details. Statistical designations are used for reference only and do not imply political recognition or legal status.
      parameters:
        - $ref: "#/components/parameters/CountryOrAreaID"
      responses:
        "200":
          description: Country profile record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryProfileResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/assets/flags/{country_id}.svg:
    get:
      tags: [Geography]
      summary: Get a country or area flag SVG
      parameters:
        - $ref: "#/components/parameters/CountryOrAreaFlagID"
      responses:
        "200":
          description: Country or area flag SVG
          content:
            image/svg+xml:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/education/universities:
    get:
      tags: [Education]
      summary: List universities
      description: Returns the verified current NUC university register snapshot. Ownership and state filters are optional and may be combined.
      parameters:
        - $ref: "#/components/parameters/UniversityOwnershipType"
        - $ref: "#/components/parameters/UniversityStateID"
      responses:
        "200":
          description: University records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniversityListResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/education/universities/{university_id}:
    get:
      tags: [Education]
      summary: Get a university
      description: Returns a verified university record from the current NUC register snapshot.
      parameters:
        - $ref: "#/components/parameters/UniversityID"
      responses:
        "200":
          description: University record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniversityResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/education/colleges-of-education:
    get:
      tags: [Education]
      summary: List colleges of education
      description: Returns the verified current NCCE colleges-of-education snapshot. Ownership and state filters are optional and may be combined.
      parameters:
        - $ref: "#/components/parameters/CollegeOfEducationOwnershipType"
        - $ref: "#/components/parameters/CollegeOfEducationStateID"
      responses:
        "200":
          description: College of education records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollegeOfEducationListResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/education/colleges-of-education/{college_id}:
    get:
      tags: [Education]
      summary: Get a college of education
      description: Returns a verified college of education record from the current NCCE register snapshot.
      parameters:
        - $ref: "#/components/parameters/CollegeOfEducationID"
      responses:
        "200":
          description: College of education record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollegeOfEducationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/education/polytechnics:
    get:
      tags: [Education]
      operationId: listPolytechnics
      summary: List polytechnics
      description: Returns 168 verified NBTE polytechnic records.
      responses:
        "200": {description: Polytechnic records, content: {application/json: {schema: {$ref: "#/components/schemas/EducationInstitutionListResponse"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/education/polytechnics/{institution_id}:
    get:
      tags: [Education]
      operationId: getPolytechnic
      summary: Get a polytechnic
      parameters: [{$ref: "#/components/parameters/EducationInstitutionID"}]
      responses:
        "200": {description: Polytechnic record, content: {application/json: {schema: {$ref: "#/components/schemas/EducationInstitutionDetailResponse"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/education/monotechnics:
    get:
      tags: [Education]
      operationId: listMonotechnics
      summary: List monotechnics
      description: Returns 86 verified NBTE monotechnic records.
      responses:
        "200": {description: Monotechnic records, content: {application/json: {schema: {$ref: "#/components/schemas/EducationInstitutionListResponse"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/education/monotechnics/{institution_id}:
    get:
      tags: [Education]
      operationId: getMonotechnic
      summary: Get a monotechnic
      parameters: [{$ref: "#/components/parameters/EducationInstitutionID"}]
      responses:
        "200": {description: Monotechnic record, content: {application/json: {schema: {$ref: "#/components/schemas/EducationInstitutionDetailResponse"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/education/colleges-of-agriculture:
    get:
      tags: [Education]
      operationId: listCollegesOfAgriculture
      summary: List colleges of agriculture
      description: Returns 31 verified NBTE colleges of agriculture records.
      responses:
        "200": {description: College of agriculture records, content: {application/json: {schema: {$ref: "#/components/schemas/EducationInstitutionListResponse"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/education/colleges-of-agriculture/{institution_id}:
    get:
      tags: [Education]
      operationId: getCollegeOfAgriculture
      summary: Get a college of agriculture
      parameters: [{$ref: "#/components/parameters/EducationInstitutionID"}]
      responses:
        "200": {description: College of agriculture record, content: {application/json: {schema: {$ref: "#/components/schemas/EducationInstitutionDetailResponse"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/education/colleges-of-health-sciences-and-technology:
    get:
      tags: [Education]
      operationId: listCollegesOfHealthSciencesAndTechnology
      summary: List colleges of health sciences and technology
      description: Returns 98 verified NBTE colleges of health sciences and technology records.
      responses:
        "200": {description: College records, content: {application/json: {schema: {$ref: "#/components/schemas/EducationInstitutionListResponse"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/education/colleges-of-health-sciences-and-technology/{institution_id}:
    get:
      tags: [Education]
      operationId: getCollegeOfHealthSciencesAndTechnology
      summary: Get a college of health sciences and technology
      parameters: [{$ref: "#/components/parameters/EducationInstitutionID"}]
      responses:
        "200": {description: College record, content: {application/json: {schema: {$ref: "#/components/schemas/EducationInstitutionDetailResponse"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/education/colleges-of-nursing-and-midwifery:
    get:
      tags: [Education]
      operationId: listCollegesOfNursingAndMidwifery
      summary: List colleges of nursing and midwifery
      description: Returns 152 public records from the NMCN December 2025 approved-schools snapshot. This is a snapshot, not a continuously current live register.
      responses:
        "200": {description: Nursing and midwifery records, content: {application/json: {schema: {$ref: "#/components/schemas/EducationInstitutionListResponse"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/education/colleges-of-nursing-and-midwifery/{institution_id}:
    get:
      tags: [Education]
      operationId: getCollegeOfNursingAndMidwifery
      summary: Get a college of nursing and midwifery
      parameters: [{$ref: "#/components/parameters/EducationInstitutionID"}]
      responses:
        "200": {description: Nursing and midwifery record, content: {application/json: {schema: {$ref: "#/components/schemas/EducationInstitutionDetailResponse"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/education/vocational-enterprise-institutions:
    get:
      tags: [Education]
      operationId: listVocationalEnterpriseInstitutions
      summary: List vocational enterprise institutions
      description: Returns 25 verified Digital NBTE vocational enterprise institution records.
      responses:
        "200": {description: Vocational enterprise institution records, content: {application/json: {schema: {$ref: "#/components/schemas/EducationInstitutionListResponse"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/education/vocational-enterprise-institutions/{institution_id}:
    get:
      tags: [Education]
      operationId: getVocationalEnterpriseInstitution
      summary: Get a vocational enterprise institution
      parameters: [{$ref: "#/components/parameters/EducationInstitutionID"}]
      responses:
        "200": {description: Vocational enterprise institution record, content: {application/json: {schema: {$ref: "#/components/schemas/EducationInstitutionDetailResponse"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/education/technical-colleges:
    get:
      tags: [Education]
      operationId: listTechnicalColleges
      summary: List technical colleges
      description: Returns 115 verified row-level institutions from the NBTE Technical Colleges directory snapshot. NBTE separately reports a sector total of 153; unidentified institutions are not fabricated into this API dataset, and wrong-category or unresolved directory entries were excluded through reconciliation.
      responses:
        "200": {description: Technical college records, content: {application/json: {schema: {$ref: "#/components/schemas/EducationInstitutionListResponse"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/education/technical-colleges/{institution_id}:
    get:
      tags: [Education]
      operationId: getTechnicalCollege
      summary: Get a technical college
      parameters: [{$ref: "#/components/parameters/EducationInstitutionID"}]
      responses:
        "200": {description: Technical college record, content: {application/json: {schema: {$ref: "#/components/schemas/EducationInstitutionDetailResponse"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/education/primary-and-secondary-schools:
    get:
      tags: [Education]
      operationId: listPrimaryAndSecondarySchools
      summary: List primary and secondary schools
      description: Returns an always-paginated UBEC 2022 observed school snapshot; it is not a current live school-licensing register.
      parameters:
        - {$ref: "#/components/parameters/SchoolPage"}
        - {$ref: "#/components/parameters/SchoolPageSize"}
        - {$ref: "#/components/parameters/SchoolStateID"}
        - {$ref: "#/components/parameters/SchoolLGAID"}
        - {$ref: "#/components/parameters/SchoolEducationLevel"}
        - {$ref: "#/components/parameters/SchoolOwnershipType"}
        - {$ref: "#/components/parameters/SchoolSearch"}
      responses:
        "200": {description: Paginated school records, content: {application/json: {schema: {$ref: "#/components/schemas/PrimaryAndSecondarySchoolListResponse"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/education/primary-and-secondary-schools/{school_id}:
    get:
      tags: [Education]
      operationId: getPrimaryAndSecondarySchool
      summary: Get a primary or secondary school
      parameters:
        - {$ref: "#/components/parameters/SchoolID"}
      responses:
        "200": {description: School record, content: {application/json: {schema: {$ref: "#/components/schemas/PrimaryAndSecondarySchoolResponse"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/healthcare/health-facilities:
    get:
      tags: [Healthcare]
      operationId: listHealthFacilities
      summary: List health facilities
      description: Returns the paginated GRID3 Nigeria Health Facilities v2.0 observed snapshot containing 50,654 source-verified facilities. The source snapshot was last updated on 2024-11-11 and does not establish current operational status. It is not a live NHFR register, complete currently operational facility list, or FMoH licensing register.
      parameters:
        - {$ref: "#/components/parameters/HealthFacilityPage"}
        - {$ref: "#/components/parameters/HealthFacilityPageSize"}
        - {$ref: "#/components/parameters/HealthFacilityStateID"}
        - {$ref: "#/components/parameters/HealthFacilityLGAID"}
        - {$ref: "#/components/parameters/HealthFacilityType"}
        - {$ref: "#/components/parameters/HealthFacilityLevel"}
        - {$ref: "#/components/parameters/HealthFacilityOwnershipType"}
        - {$ref: "#/components/parameters/HealthFacilitySearch"}
      responses:
        "200": {description: Paginated health-facility records, content: {application/json: {schema: {$ref: "#/components/schemas/HealthFacilityListResponse"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/healthcare/health-facilities/{facility_id}:
    get:
      tags: [Healthcare]
      operationId: getHealthFacility
      summary: Get a health facility
      description: Returns one facility from the GRID3 Nigeria Health Facilities v2.0 observed snapshot. The source snapshot was last updated on 2024-11-11 and does not establish current operational status.
      parameters: [{$ref: "#/components/parameters/HealthFacilityID"}]
      responses:
        "200": {description: Health-facility record, content: {application/json: {schema: {$ref: "#/components/schemas/HealthFacilityDetailResponse"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/finance/payment-service-providers:
    get:
      tags: [Finance]
      summary: List payment service provider memberships
      description: Returns the verified CBN payment-service-provider snapshot as provider-category memberships. API-key identification remains optional once routed.
      parameters:
        - $ref: "#/components/parameters/PaymentServiceProviderTypeQuery"
      responses:
        "200":
          description: Payment service provider memberships
          content:
            application/json:
