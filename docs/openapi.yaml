openapi: 3.1.0
info:
  title: SoftData API
  version: 1.0.0
  description: Public datasets API with optional developer accounts and API keys.
servers:
  - url: https://softdata-api.vercel.app
    description: Production
tags:
  - name: Health
  - name: Discovery
  - name: Datasets
  - name: Geography
  - name: Education
  - name: Finance
  - name: Authentication
  - name: Account
  - name: API Keys
  - name: Usage
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1:
    get:
      tags: [Discovery]
      summary: API discovery
      responses:
        "200":
          description: API information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiInfoResponse"
  /v1/datasets:
    get:
      tags: [Datasets]
      summary: List datasets
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Dataset list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetListResponse"
  /v1/datasets/{dataset_id}:
    get:
      tags: [Datasets]
      summary: Get dataset details
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Dataset details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/datasets/{dataset_id}/versions:
    get:
      tags: [Datasets]
      summary: List dataset versions
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Dataset versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetVersionsResponse"
  /v1/datasets/{dataset_id}/sources:
    get:
      tags: [Datasets]
      summary: List dataset sources
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Dataset sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetSourcesResponse"
  /v1/datasets/{dataset_id}/download:
    get:
      tags: [Datasets]
      summary: Download a dataset
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Dataset download
          content:
            application/json:
              schema:
                type: object
  /v1/geography/states:
    get:
      tags: [Geography]
      summary: List states
      responses:
        "200":
          description: State records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateListResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/states/{state_id}:
    get:
      tags: [Geography]
      summary: Get a state
      parameters:
        - $ref: "#/components/parameters/StateID"
      responses:
        "200":
          description: State record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/geopolitical-zones:
    get:
      tags: [Geography]
      summary: List geopolitical zones
      responses:
        "200":
          description: Geopolitical zone records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeopoliticalZoneListResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/geopolitical-zones/{zone_id}:
    get:
      tags: [Geography]
      summary: Get a geopolitical zone
      parameters:
        - $ref: "#/components/parameters/ZoneID"
      responses:
        "200":
          description: Geopolitical zone record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeopoliticalZoneResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/lgas:
    get:
      tags: [Geography]
      summary: List local government units and FCT Area Councils
      parameters:
        - $ref: "#/components/parameters/StateIDQuery"
      responses:
        "200":
          description: Local-government-unit records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalGovernmentUnitListResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/lgas/{lga_id}:
    get:
      tags: [Geography]
      summary: Get a local government unit or FCT Area Council
      parameters:
        - $ref: "#/components/parameters/LGAID"
      responses:
        "200":
          description: Local-government-unit record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalGovernmentUnitResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/languages:
    get:
      tags: [Geography]
      summary: List CLDR-derived world languages
      description: Returns the 633 current English CLDR base-language records. This v1 endpoint has no pagination or search and is publicly accessible.
      responses:
        "200":
          description: Language records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageListResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/languages/{language_id}:
    get:
      tags: [Geography]
      summary: Get a CLDR-derived world language
      parameters:
        - $ref: "#/components/parameters/LanguageID"
      responses:
        "200":
          description: Language record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/country-languages:
    get:
      tags: [Geography]
      summary: List CLDR-derived country-language relationships
      description: Returns all 1,289 relationships when filters are omitted. Filters use AND semantics, are optional, and no pagination is available in v1. The used status means CLDR supplied a relationship without officialStatus and does not independently claim legal recognition or official status.
      parameters:
        - $ref: "#/components/parameters/CountryLanguageCountryAreaID"
        - $ref: "#/components/parameters/CountryLanguageIDQuery"
        - $ref: "#/components/parameters/CountryLanguageStatusQuery"
      responses:
        "200":
          description: Country-language relationship records; an empty array is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryLanguageListResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/time-zones:
    get:
      tags: [Geography]
      summary: List time zones
      description: Returns the current canonical IANA time-zone manifest from tzdb 2026c, limited to zone1970.tab entries. Aliases are excluded from v1. Asia/Taipei has an empty country_area_ids array because TW has no approved SoftData M49 ID, while bv and hm are valid filters that return empty lists. The list is public and returns deterministic ordering with no pagination.
      parameters:
        - $ref: "#/components/parameters/TimeZoneCountryAreaID"
      responses:
        "200":
          description: Time-zone records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeZoneListResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/time-zones/{time_zone_id}:
    get:
      tags: [Geography]
      summary: Get a time zone
      description: Returns a canonical IANA time-zone identifier using an exact decoded path value. The detail route accepts percent-encoded slashes at the HTTP layer, but the public identifier remains the canonical IANA name. Aliases are excluded from v1.
      parameters:
        - $ref: "#/components/parameters/TimeZoneID"
      responses:
        "200":
          description: Time-zone record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeZoneResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/countries:
    get:
      tags: [Geography]
      summary: List countries and areas
      description: Returns the current UN M49 countries or areas snapshot. Region and subregion filters are optional and may be combined. Statistical designations are used for reference only and do not imply political recognition or legal status.
      parameters:
        - $ref: "#/components/parameters/CountryOrAreaRegionCode"
        - $ref: "#/components/parameters/CountryOrAreaSubregionCode"
      responses:
        "200":
          description: Country-or-area records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryOrAreaListResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/countries/{country_id}:
    get:
      tags: [Geography]
      summary: Get a country or area
      description: Returns a verified country-or-area record from the current UN M49 snapshot. Statistical designations are used for reference only and do not imply political recognition or legal status.
      parameters:
        - $ref: "#/components/parameters/CountryOrAreaID"
      responses:
        "200":
          description: Country-or-area record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryOrAreaResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/countries/{country_id}/profile:
    get:
      tags: [Geography]
      summary: Get a country profile
      description: Returns a derived profile for a current UN M49 country or area, combining the country-or-area record with approved currency and time-zone relationships. Statistical designations are used for reference only and do not imply political recognition or legal status.
      parameters:
        - $ref: "#/components/parameters/CountryOrAreaID"
      responses:
        "200":
          description: Country profile record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryProfileResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/assets/flags/{country_id}.svg:
    get:
      tags: [Geography]
      summary: Get a country or area flag SVG
      parameters:
        - $ref: "#/components/parameters/CountryOrAreaFlagID"
      responses:
        "200":
          description: Country or area flag SVG
          content:
            image/svg+xml:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/education/universities:
    get:
      tags: [Education]
      summary: List universities
      description: Returns the verified current NUC university register snapshot. Ownership and state filters are optional and may be combined.
      parameters:
        - $ref: "#/components/parameters/UniversityOwnershipType"
        - $ref: "#/components/parameters/UniversityStateID"
      responses:
        "200":
          description: University records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniversityListResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/education/universities/{university_id}:
    get:
      tags: [Education]
      summary: Get a university
      description: Returns a verified university record from the current NUC register snapshot.
      parameters:
        - $ref: "#/components/parameters/UniversityID"
      responses:
        "200":
          description: University record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniversityResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/education/colleges-of-education:
    get:
      tags: [Education]
      summary: List colleges of education
      description: Returns the verified current NCCE colleges-of-education snapshot. Ownership and state filters are optional and may be combined.
      parameters:
        - $ref: "#/components/parameters/CollegeOfEducationOwnershipType"
        - $ref: "#/components/parameters/CollegeOfEducationStateID"
      responses:
        "200":
          description: College of education records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollegeOfEducationListResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/education/colleges-of-education/{college_id}:
    get:
      tags: [Education]
      summary: Get a college of education
      description: Returns a verified college of education record from the current NCCE register snapshot.
      parameters:
        - $ref: "#/components/parameters/CollegeOfEducationID"
      responses:
        "200":
          description: College of education record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollegeOfEducationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/finance/payment-service-providers:
    get:
      tags: [Finance]
      summary: List payment service provider memberships
      description: Returns the verified CBN payment-service-provider snapshot as provider-category memberships. API-key identification remains optional once routed.
      parameters:
        - $ref: "#/components/parameters/PaymentServiceProviderTypeQuery"
      responses:
        "200":
          description: Payment service provider memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentServiceProviderListResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/finance/payment-service-providers/{provider_id}:
    get:
      tags: [Finance]
      summary: Get a payment service provider membership
      description: Returns a verified provider-category membership from the CBN snapshot. API-key identification remains optional once routed.
      parameters:
        - $ref: "#/components/parameters/PaymentServiceProviderID"
      responses:
        "200":
          description: Payment service provider membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentServiceProviderResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/finance/international-money-transfer-operators:
    get:
      tags: [Finance]
      summary: List international money transfer operators
      description: Returns the verified current CBN IMTO register snapshot. API-key identification remains optional once routed.
      responses:
        "200":
          description: International money transfer operator records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternationalMoneyTransferOperatorListResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/finance/international-money-transfer-operators/{operator_id}:
    get:
      tags: [Finance]
      summary: Get an international money transfer operator
      description: Returns a verified IMTO record from the CBN snapshot. API-key identification remains optional once routed.
      parameters:
        - $ref: "#/components/parameters/InternationalMoneyTransferOperatorID"
      responses:
        "200":
          description: International money transfer operator record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternationalMoneyTransferOperatorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/finance/currencies:
    get:
      tags: [Finance]
      summary: List currencies
      description: Returns the current ISO 4217 monetary currency snapshot compiled from the SIX List One XML. The optional country_area_id filter narrows the list to currencies linked to a specific UN M49 country or area.
      parameters:
        - $ref: "#/components/parameters/CurrencyCountryAreaIDQuery"
      responses:
        "200":
          description: Currency records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencyListResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/finance/currencies/{currency_id}:
    get:
      tags: [Finance]
      summary: Get a currency
      description: Returns a verified ISO 4217 monetary currency from the current SIX List One XML snapshot.
      parameters:
        - $ref: "#/components/parameters/CurrencyID"
      responses:
        "200":
          description: Currency record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencyResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refreshed authentication tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Log out
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out
  /v1/account:
    get:
      tags: [Account]
      summary: Get current account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
    patch:
      tags: [Account]
      summary: Update current account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdateRequest"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Account]
      summary: Delete current account
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Account deleted
  /v1/account/api-keys:
    get:
      tags: [API Keys]
      summary: List API keys
      security:
        - bearerAuth: []
      responses:
        "200":
          description: API key list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyListResponse"
    post:
      tags: [API Keys]
      summary: Create an API key
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreatedResponse"
  /v1/account/api-keys/{key_id}:
    delete:
      tags: [API Keys]
      summary: Revoke an API key
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KeyId"
      responses:
        "204":
          description: API key revoked
  /v1/account/api-keys/{key_id}/rotate:
    post:
      tags: [API Keys]
      summary: Rotate an API key
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KeyId"
      responses:
        "200":
          description: Rotated API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyRotatedResponse"
  /v1/account/usage:
    get:
      tags: [Usage]
      summary: View usage summary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UsageStartDate"
        - $ref: "#/components/parameters/UsageEndDate"
        - $ref: "#/components/parameters/UsageAPIKeyID"
      responses:
        "200":
          description: Usage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummaryReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/account/usage/history:
    get:
      tags: [Usage]
      summary: View aggregated daily usage history
      description: Returns daily aggregate usage for the authenticated account. Raw api_requests rows are never exposed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UsageStartDate"
        - $ref: "#/components/parameters/UsageEndDate"
        - $ref: "#/components/parameters/UsageAPIKeyID"
      responses:
        "200":
          description: Aggregated usage history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageHistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/account/usage/endpoints:
    get:
      tags: [Usage]
      summary: View endpoint usage breakdown
      description: Returns usage grouped by stable endpoint template for the authenticated account. Raw URLs and request parameters are never exposed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UsageStartDate"
        - $ref: "#/components/parameters/UsageEndDate"
        - $ref: "#/components/parameters/UsageAPIKeyID"
      responses:
        "200":
          description: Endpoint usage breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointUsageListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/account/usage/dataset-groups:
    get:
      tags: [Usage]
      summary: View dataset-group usage breakdown
      description: Returns usage grouped by documented dataset group for the authenticated account. Null groups and raw request rows are never exposed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UsageStartDate"
        - $ref: "#/components/parameters/UsageEndDate"
        - $ref: "#/components/parameters/UsageAPIKeyID"
      responses:
        "200":
          description: Dataset-group usage breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetGroupUsageListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    DatasetId:
      name: dataset_id
      in: path
      required: true
      schema:
        type: string
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
    StateID:
      name: state_id
      in: path
      required: true
      description: Public lowercase slug for a Nigerian state or the Federal Capital Territory.
      schema:
        type: string
        pattern: '^[a-z]+(?:-[a-z]+)*$'
      example: akwa-ibom
    StateIDQuery:
      name: state_id
      in: query
      required: false
      description: Optional public state or FCT ID used to filter local-government-unit results.
      schema:
        type: string
    ZoneID:
      name: zone_id
      in: path
      required: true
      description: Public lowercase slug for a Nigerian geopolitical zone.
      schema:
        type: string
        pattern: '^[a-z]+(?:-[a-z]+)*$'
      example: north-central
    LGAID:
      name: lga_id
      in: path
      required: true
      description: Stable public identifier for a local government unit or FCT Area Council.
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)+$'
    TimeZoneID:
      name: time_zone_id
      in: path
      required: true
      allowReserved: true
      description: Exact canonical IANA time-zone identifier. Percent-encoded slashes are accepted by the HTTP layer and decoded before validation. Aliases are excluded from v1.
      schema:
        type: string
    TimeZoneCountryAreaID:
      name: country_area_id
      in: query
      required: false
      description: Optional public country or area ID used to filter time-zone records.
      schema:
        type: string
        pattern: '^[a-z]{2}$'
    CountryOrAreaID:
      name: country_id
      in: path
      required: true
      description: Stable lowercase alpha-2 identifier for a UN M49 country or area.
      schema:
        type: string
        pattern: '^[a-z]{2}$'
    CountryOrAreaFlagID:
      name: country_id
      in: path
      required: true
      description: Stable lowercase alpha-2 identifier for a UN M49 country or area SVG flag asset.
      schema:
        type: string
        pattern: '^[a-z]{2}\.svg$'
    CountryOrAreaRegionCode:
      name: region_code
      in: query
      required: false
      description: Optional UN M49 region code used to filter country or area records.
      schema:
        type: string
        pattern: '^[0-9]{3}$'
    CountryOrAreaSubregionCode:
      name: subregion_code
      in: query
      required: false
      description: Optional UN M49 subregion code used to filter country or area records.
      schema:
        type: string
        pattern: '^[0-9]{3}$'
    LanguageID:
      name: language_id
      in: path
      required: true
      description: Published lowercase CLDR base-language identifier.
      schema:
        $ref: "#/components/schemas/LanguageID"
    CountryLanguageCountryAreaID:
      name: country_area_id
      in: query
      required: false
      description: Optional lowercase country or area ID used to filter relationships.
      schema:
        type: string
        pattern: '^[a-z]{2}$'
    CountryLanguageIDQuery:
      name: language_id
      in: query
      required: false
      description: Optional published lowercase CLDR base-language ID used to filter relationships.
      schema:
        $ref: "#/components/schemas/LanguageID"
    CountryLanguageStatusQuery:
      name: status
      in: query
      required: false
      description: Optional relationship status filter.
      schema:
        $ref: "#/components/schemas/CountryLanguageStatus"
    UniversityID:
      name: university_id
      in: path
      required: true
      description: Stable public identifier for a current NUC-listed university.
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)+$'
    UniversityOwnershipType:
      name: ownership_type
      in: query
      required: false
      description: Optional university ownership category used to filter universities.
      schema:
        $ref: "#/components/schemas/UniversityOwnershipType"
    UniversityStateID:
      name: state_id
      in: query
      required: false
      description: Optional public state or FCT ID used to filter universities.
      schema:
        $ref: "#/components/schemas/UniversityStateID"
    CollegeOfEducationID:
      name: college_id
      in: path
      required: true
      description: Stable public identifier for a college of education.
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)+$'
    CollegeOfEducationOwnershipType:
      name: ownership_type
      in: query
      required: false
      description: Optional college-of-education ownership category used to filter colleges.
      schema:
        $ref: "#/components/schemas/CollegeOfEducationOwnershipType"
    CollegeOfEducationStateID:
      name: state_id
      in: query
      required: false
      description: Optional public state or FCT ID used to filter college-of-education records.
      schema:
        $ref: "#/components/schemas/CollegeOfEducationStateID"
    PaymentServiceProviderID:
      name: provider_id
      in: path
      required: true
      description: Stable public identifier for a payment-service-provider membership.
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)+$'
    PaymentServiceProviderTypeQuery:
      name: institution_type
      in: query
      required: false
      description: Optional payment-service-provider category used to filter provider-category memberships.
      schema:
        $ref: "#/components/schemas/PaymentServiceProviderType"
    InternationalMoneyTransferOperatorID:
      name: operator_id
      in: path
      required: true
      description: Stable public identifier for an international money transfer operator.
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    CurrencyID:
      name: currency_id
      in: path
      required: true
      description: Stable public identifier for a currency.
      schema:
        type: string
        pattern: '^[a-z]{3}$'
    CurrencyCountryAreaIDQuery:
      name: country_area_id
      in: query
      required: false
      description: Optional UN M49 country or area ID used to filter currency records.
      schema:
        type: string
        pattern: '^[a-z]{2}$'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      schema:
        type: string
    Sort:
      name: sort
      in: query
      schema:
        type: string
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    Format:
      name: format
      in: query
      schema:
        type: string
        enum: [json, csv, geojson]
    UsageStartDate:
      name: start
      in: query
      schema:
        type: string
        format: date
      description: Start of the half-open reporting range in UTC, formatted as YYYY-MM-DD. Omit with end to use the current UTC calendar month. Start is inclusive.
    UsageEndDate:
      name: end
      in: query
      schema:
        type: string
        format: date
      description: End of the half-open reporting range in UTC, formatted as YYYY-MM-DD. Omit with start to use the current UTC calendar month. End is exclusive. Explicit ranges may not exceed 366 days.
    UsageAPIKeyID:
      name: api_key_id
      in: query
      schema:
        type: string
      description: Optional owned API key ID filter within the authenticated account. Missing or foreign-owned keys return 404.
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
        status:
          type: string
      required: [success, status]
    ApiInfoResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
      required: [success, data]
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      required: [page, limit, total, total_pages]
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              nullable: true
            request_id:
              type: string
          required: [code, message, request_id]
      required: [success, error]
    LanguageID:
      type: string
      pattern: '^[a-z]{2,3}$'
      description: Published lowercase CLDR base-language identifier; aliases and script or region subtags are excluded.
    CountryLanguageStatus:
      type: string
      enum: [official, de_facto_official, official_regional, used]
      description: CLDR-derived relationship status. used means no officialStatus was supplied by CLDR and is not an independent legal-status claim.
    Language:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/LanguageID"
        name:
          type: string
          minLength: 1
      required: [id, name]
    CountryLanguage:
