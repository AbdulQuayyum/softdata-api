openapi: 3.1.0
info:
  title: SoftData API
  version: 1.0.0
  description: Public datasets API with optional developer accounts and API keys.
servers:
  - url: https://softdata-api.vercel.app
    description: Production
tags:
  - name: Health
  - name: Discovery
  - name: Datasets
  - name: Geography
  - name: Authentication
  - name: Account
  - name: API Keys
  - name: Usage
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1:
    get:
      tags: [Discovery]
      summary: API discovery
      responses:
        "200":
          description: API information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiInfoResponse"
  /v1/datasets:
    get:
      tags: [Datasets]
      summary: List datasets
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Dataset list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetListResponse"
  /v1/datasets/{dataset_id}:
    get:
      tags: [Datasets]
      summary: Get dataset details
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Dataset details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/datasets/{dataset_id}/versions:
    get:
      tags: [Datasets]
      summary: List dataset versions
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Dataset versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetVersionsResponse"
  /v1/datasets/{dataset_id}/sources:
    get:
      tags: [Datasets]
      summary: List dataset sources
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Dataset sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetSourcesResponse"
  /v1/datasets/{dataset_id}/download:
    get:
      tags: [Datasets]
      summary: Download a dataset
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Dataset download
          content:
            application/json:
              schema:
                type: object
  /v1/geography/states:
    get:
      tags: [Geography]
      summary: List states
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: Geographic records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeographyListResponse"
  /v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refreshed authentication tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Log out
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out
  /v1/account:
    get:
      tags: [Account]
      summary: Get current account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
    patch:
      tags: [Account]
      summary: Update current account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
    delete:
      tags: [Account]
      summary: Delete current account
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Account deleted
  /v1/account/api-keys:
    get:
      tags: [API Keys]
      summary: List API keys
      security:
        - bearerAuth: []
      responses:
        "200":
          description: API key list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyListResponse"
    post:
      tags: [API Keys]
      summary: Create an API key
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreatedResponse"
  /v1/account/api-keys/{key_id}:
    delete:
      tags: [API Keys]
      summary: Revoke an API key
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KeyId"
      responses:
        "204":
          description: API key revoked
  /v1/account/api-keys/{key_id}/rotate:
    post:
      tags: [API Keys]
      summary: Rotate an API key
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KeyId"
      responses:
        "200":
          description: Rotated API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyRotatedResponse"
  /v1/account/usage:
    get:
      tags: [Usage]
      summary: View usage summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummaryResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    DatasetId:
      name: dataset_id
      in: path
      required: true
      schema:
        type: string
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      schema:
        type: string
    Sort:
      name: sort
      in: query
      schema:
        type: string
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    Format:
      name: format
      in: query
      schema:
        type: string
        enum: [json, csv, geojson]
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
        status:
          type: string
      required: [success, status]
    ApiInfoResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
      required: [success, data]
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      required: [page, limit, total, total_pages]
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              nullable: true
            request_id:
              type: string
          required: [code, message, request_id]
      required: [success, error]
    State:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        capital:
          type: string
        country_code:
          type: string
        geopolitical_zone:
          type: string
      required: [code, name]
    GeographyListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/State"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required: [success, data]
    Dataset:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        group:
          type: string
        version:
          type: string
        status:
          type: string
      required: [id, name, group, version, status]
    DatasetListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/Dataset"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required: [success, data]
    DatasetResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/Dataset"
      required: [success, data]
    DatasetVersionsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
      required: [success, data]
    DatasetSourcesResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
      required: [success, data]
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
          nullable: true
        password:
          type: string
          format: password
      required: [username, password]
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required: [refresh_token]
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
      required: [success, data]
    AccountResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
      required: [success, data]
    CreateApiKeyRequest:
      type: object
      properties:
        name:
          type: string
      required: [name]
    ApiKeyCreatedResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
      required: [success, data]
    ApiKeyListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
      required: [success, data]
    ApiKeyRotatedResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
      required: [success, data]
    UsageSummaryResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
      required: [success, data]
