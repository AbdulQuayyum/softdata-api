openapi: 3.1.0
info:
  title: SoftData API
  version: 1.0.0
  description: Public datasets API with optional developer accounts and API keys.
servers:
  - url: https://softdata-api.vercel.app
    description: Production
tags:
  - name: Health
  - name: Discovery
  - name: Datasets
  - name: Geography
  - name: Authentication
  - name: Account
  - name: API Keys
  - name: Usage
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1:
    get:
      tags: [Discovery]
      summary: API discovery
      responses:
        "200":
          description: API information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiInfoResponse"
  /v1/datasets:
    get:
      tags: [Datasets]
      summary: List datasets
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Dataset list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetListResponse"
  /v1/datasets/{dataset_id}:
    get:
      tags: [Datasets]
      summary: Get dataset details
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Dataset details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/datasets/{dataset_id}/versions:
    get:
      tags: [Datasets]
      summary: List dataset versions
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Dataset versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetVersionsResponse"
  /v1/datasets/{dataset_id}/sources:
    get:
      tags: [Datasets]
      summary: List dataset sources
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Dataset sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetSourcesResponse"
  /v1/datasets/{dataset_id}/download:
    get:
      tags: [Datasets]
      summary: Download a dataset
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Dataset download
          content:
            application/json:
              schema:
                type: object
  /v1/geography/states:
    get:
      tags: [Geography]
      summary: List states
      responses:
        "200":
          description: State records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateListResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/geography/states/{state_id}:
    get:
      tags: [Geography]
      summary: Get a state
      parameters:
        - $ref: "#/components/parameters/StateID"
      responses:
        "200":
          description: State record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refreshed authentication tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Log out
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out
  /v1/account:
    get:
      tags: [Account]
      summary: Get current account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
    patch:
      tags: [Account]
      summary: Update current account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdateRequest"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Account]
      summary: Delete current account
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Account deleted
  /v1/account/api-keys:
    get:
      tags: [API Keys]
      summary: List API keys
      security:
        - bearerAuth: []
      responses:
        "200":
          description: API key list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyListResponse"
    post:
      tags: [API Keys]
      summary: Create an API key
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreatedResponse"
  /v1/account/api-keys/{key_id}:
    delete:
      tags: [API Keys]
      summary: Revoke an API key
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KeyId"
      responses:
        "204":
          description: API key revoked
  /v1/account/api-keys/{key_id}/rotate:
    post:
      tags: [API Keys]
      summary: Rotate an API key
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KeyId"
      responses:
        "200":
          description: Rotated API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyRotatedResponse"
  /v1/account/usage:
    get:
      tags: [Usage]
      summary: View usage summary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UsageStartDate"
        - $ref: "#/components/parameters/UsageEndDate"
        - $ref: "#/components/parameters/UsageAPIKeyID"
      responses:
        "200":
          description: Usage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummaryReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/account/usage/history:
    get:
      tags: [Usage]
      summary: View aggregated daily usage history
      description: Returns daily aggregate usage for the authenticated account. Raw api_requests rows are never exposed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UsageStartDate"
        - $ref: "#/components/parameters/UsageEndDate"
        - $ref: "#/components/parameters/UsageAPIKeyID"
      responses:
        "200":
          description: Aggregated usage history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageHistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/account/usage/endpoints:
    get:
      tags: [Usage]
      summary: View endpoint usage breakdown
      description: Returns usage grouped by stable endpoint template for the authenticated account. Raw URLs and request parameters are never exposed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UsageStartDate"
        - $ref: "#/components/parameters/UsageEndDate"
        - $ref: "#/components/parameters/UsageAPIKeyID"
      responses:
        "200":
          description: Endpoint usage breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointUsageListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/account/usage/dataset-groups:
    get:
      tags: [Usage]
      summary: View dataset-group usage breakdown
      description: Returns usage grouped by documented dataset group for the authenticated account. Null groups and raw request rows are never exposed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UsageStartDate"
        - $ref: "#/components/parameters/UsageEndDate"
        - $ref: "#/components/parameters/UsageAPIKeyID"
      responses:
        "200":
          description: Dataset-group usage breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetGroupUsageListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    DatasetId:
      name: dataset_id
      in: path
      required: true
      schema:
        type: string
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
    StateID:
      name: state_id
      in: path
      required: true
      description: Public lowercase slug for a Nigerian state or the Federal Capital Territory.
      schema:
        type: string
        pattern: '^[a-z]+(?:-[a-z]+)*$'
      example: akwa-ibom
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      schema:
        type: string
    Sort:
      name: sort
      in: query
      schema:
        type: string
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    Format:
      name: format
      in: query
      schema:
        type: string
        enum: [json, csv, geojson]
    UsageStartDate:
      name: start
      in: query
      schema:
        type: string
        format: date
      description: Start of the half-open reporting range in UTC, formatted as YYYY-MM-DD. Omit with end to use the current UTC calendar month. Start is inclusive.
    UsageEndDate:
      name: end
      in: query
      schema:
        type: string
        format: date
      description: End of the half-open reporting range in UTC, formatted as YYYY-MM-DD. Omit with start to use the current UTC calendar month. End is exclusive. Explicit ranges may not exceed 366 days.
    UsageAPIKeyID:
      name: api_key_id
      in: query
      schema:
        type: string
      description: Optional owned API key ID filter within the authenticated account. Missing or foreign-owned keys return 404.
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
        status:
          type: string
      required: [success, status]
    ApiInfoResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
      required: [success, data]
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      required: [page, limit, total, total_pages]
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              nullable: true
            request_id:
              type: string
          required: [code, message, request_id]
      required: [success, error]
    State:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        official_name:
          type: string
        administrative_type:
          type: string
          enum: [state, federal_capital_territory]
        capital:
          type: string
        geopolitical_zone_id:
          type: string
          enum: [north-central, north-east, north-west, south-east, south-south, south-west]
        country_code:
          type: string
          enum: [NG]
      required: [id, name, official_name, administrative_type, capital, geopolitical_zone_id, country_code]
    StateListResponse:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/State"
      required: [success, data]
    StateResponse:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/State"
      required: [success, data]
    GeographyListResponse:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/State"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required: [success, data]
    Dataset:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        group:
          type: string
        version:
          type: string
        status:
          type: string
      required: [id, name, group, version, status]
    DatasetListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/Dataset"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required: [success, data]
    DatasetResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/Dataset"
      required: [success, data]
    DatasetVersionsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
      required: [success, data]
    DatasetSourcesResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
      required: [success, data]
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
          nullable: true
        password:
          type: string
          format: password
      required: [username, password]
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required: [refresh_token]
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
      required: [success, data]
    AccountResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
      required: [success, data]
    AccountUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          oneOf:
            - type: string
              minLength: 1
            - type: "null"
          description: Optional username. Omit or set to null to leave unchanged.
        email:
          oneOf:
            - type: string
              format: email
            - type: string
              maxLength: 0
            - type: "null"
          description: Optional email address. Omit or set to null to leave unchanged. An empty string clears the email.
    UsageSummaryReport:
      type: object
      additionalProperties: false
      properties:
        total_requests:
          type: integer
          format: int64
        successful_requests:
          type: integer
          format: int64
        error_count:
          type: integer
          format: int64
        current_allowance:
          type: integer
          format: int64
        remaining_allowance:
          type: integer
          format: int64
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
      required: [total_requests, successful_requests, error_count, current_allowance, remaining_allowance, period_start, period_end]
    UsageSummaryReportResponse:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/UsageSummaryReport"
      required: [success, data]
    UsageDailyResponse:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date-time
        total_requests:
          type: integer
          format: int64
        successful_requests:
          type: integer
          format: int64
        error_count:
          type: integer
          format: int64
      required: [date, total_requests, successful_requests, error_count]
    UsageHistoryResponse:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/UsageDailyResponse"
      required: [success, data]
    EndpointUsageResponse:
      type: object
      additionalProperties: false
      properties:
        endpoint:
          type: string
        request_count:
          type: integer
          format: int64
      required: [endpoint, request_count]
    EndpointUsageListResponse:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/EndpointUsageResponse"
      required: [success, data]
    DatasetGroupUsageResponse:
      type: object
      additionalProperties: false
      properties:
        dataset_group:
          type: string
          enum: [geography, finance, education, healthcare, emergency, infrastructure, statistics]
        request_count:
          type: integer
          format: int64
      required: [dataset_group, request_count]
    DatasetGroupUsageListResponse:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/DatasetGroupUsageResponse"
      required: [success, data]
    CreateApiKeyRequest:
      type: object
      properties:
        name:
          type: string
      required: [name]
    ApiKeyCreatedResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
      required: [success, data]
    ApiKeyListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
      required: [success, data]
    ApiKeyRotatedResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
      required: [success, data]
    UsageSummaryResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
      required: [success, data]
